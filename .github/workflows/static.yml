# ng-runner-policy: private-jit-only-v1
name: Deploy static content to Pages


run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') &&
      format('action:{0}:pool:{1}:tag:{2}', inputs.action || 'release', inputs.runner_pool || 'private', github.ref_name) ||
      github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}', inputs.action || 'release', inputs.runner_pool || 'private') || format('action:publish:pool:private') }}
on:
  push:
    branches:
      - "unstable"
  workflow_dispatch:
    inputs:
      action:
        description: Required manual workflow action
        type: choice
        options: [publish]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true

permissions:
  contents: read
  pages: write  
  id-token: write 

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/master' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-cosmos-servapps-official","ng-main-run-{0}","gha-{0}-deploy"]}}', github.run_id)) }}
    steps:
      # Always check out master at the root. Without an explicit ref, the
      # checkout follows the branch that triggered the workflow (GITHUB_REF),
      # so a push to "unstable" would deploy unstable's apps at the site root
      # (the master path). Pinning the root to master keeps the two stores
      # separated: master at "/" and unstable under "/unstable/".
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Checkout unstable
        uses: actions/checkout@v7
        with:
          ref: unstable
          path: unstable
          clean: false

      - name: Remove .git from unstable
        run: rm -rf unstable/.git

      - name: Find and Replace unstable base URL
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          include: "unstable/**"
          find: "https://azukaar.github.io/cosmos-servapps-official/"
          replace: "https://azukaar.github.io/cosmos-servapps-official/unstable/"
          regex: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build static files
        run: node index.js && cd unstable && node index.js

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
