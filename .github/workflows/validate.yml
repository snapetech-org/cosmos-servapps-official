# ng-runner-policy: private-jit-only-v1
name: Validate Servapps

# Runs the servapp validation suite on pull requests and pushes to the
# main branches (master and unstable).
#
# What it checks (see .github/scripts/validate-servapps.js):
#   1. description.json is valid JSON and has all required fields.
#   2. cosmos-compose.json renders with the same whiskers engine + JSON
#      parsing that Cosmos uses at install time.
#   3. No copy-pasted URLs from other stores (e.g. a different Cosmos store
#      like resiSTORE, "cosmos-servapps-unofficial", etc).
#   4. A compose file exists for every servapp.
#
# By default only the servapp directories changed in the diff are validated,
# so pre-existing issues in unrelated apps do not block PRs. A manual run
# (workflow_dispatch) validates the entire repository.


run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') &&
      format('action:{0}:pool:{1}:tag:{2}', inputs.action || 'ci', inputs.runner_pool || 'private', github.ref_name) ||
      github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}', inputs.action || 'ci', inputs.runner_pool || 'private') || format('action:ci:pool:private') }}
on:
  pull_request:
    types: [labeled]
    branches:
      - master
      - unstable
    paths:
      - 'servapps/**'
  push:
    branches:
      - "unstable"
    paths:
      - 'servapps/**'
  workflow_dispatch:
    inputs:
      action:
        description: Required workflow action
        type: choice
        options: [ci]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Keep external fork code off trusted JIT groups until its isolated route is authorized.
    if: >-
      (
        (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
        contains(github.event.pull_request.labels.*.name, 'action:ci') &&
        contains(github.event.pull_request.labels.*.name, 'pool:private') &&
        github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/master' &&
        inputs.action == 'ci' &&
        inputs.runner_pool == 'private'
        ) ||
        (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'workflow_dispatch')
      ) &&
      (
        github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-cosmos-servapps-official","ng-main-run-{0}","gha-{0}-validate"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Fetch all history so we can diff against the base for PRs.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Determine changed servapp directories
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD="${{ github.event.pull_request.head.sha }}"
            # Diff against the merge-base, not the live base tip, so we only
            # validate the PR's own changes (not apps added to base after the PR branched).
            BASE="$(git merge-base "$HEAD" "${{ github.event.pull_request.base.sha }}")"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '${{ github.sha }}')"
            HEAD="${{ github.sha }}"
          else
            # workflow_dispatch: full repository
            echo "changed=ALL" >> "$GITHUB_OUTPUT"
            echo "Manual full-repo validation requested."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- servapps/ \
            | sed -E 's#^servapps/([^/]+)/.*#\1#' | sort -u)

          if [ -z "$CHANGED" ]; then
            echo "No servapp directories changed."
            echo "changed=" >> "$GITHUB_OUTPUT"
          else
            LIST=""
            for d in $CHANGED; do
              case " $LIST " in
                *" $d "*) ;;
                *) LIST="$LIST $d" ;;
              esac
            done
            echo "changed=${LIST## }" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changed servapps
        run: |
          CHANGED="${{ steps.changed.outputs.changed }}"
          if [ "$CHANGED" = "ALL" ]; then
            echo "== Validating entire repository =="
            node .github/scripts/validate-servapps.js \
              || { echo "::error::Servapp validation failed. See the report above."; exit 1; }
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "No servapp changes to validate."
            exit 0
          fi
          FAIL=0
          for d in $CHANGED; do
            if [ ! -d "servapps/$d" ]; then
              echo "::warning::servapps/$d was deleted in this PR; skipping."
              continue
            fi
            echo "== Validating servapps/$d =="
            if ! node .github/scripts/validate-servapps.js "$d"; then
              FAIL=1
              echo "::error file=servapps/$d::Validation failed for servapps/$d"
            fi
          done
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
