# ng-runner-policy: private-jit-only-v1
name: Validate Servapps

# Runs the servapp validation suite on pull requests and pushes to the
# main branches (master and unstable).
#
# What it checks (see .github/scripts/validate-servapps.js):
#   1. description.json is valid JSON and has all required fields.
#   2. cosmos-compose.json renders with the same whiskers engine + JSON
#      parsing that Cosmos uses at install time.
#   3. No copy-pasted URLs from other stores (e.g. a different Cosmos store
#      like resiSTORE, "cosmos-servapps-unofficial", etc).
#   4. A compose file exists for every servapp.
#
# By default only the servapp directories changed in the diff are validated,
# so pre-existing issues in unrelated apps do not block PRs. A manual run
# (workflow_dispatch) validates the entire repository.


run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' &&
      format('owner-pr:{0}:{1}:{2}:action:{3}:pool:{4}', inputs.pr_number, inputs.pr_sha, inputs.target_run_id, inputs.action_tag, inputs.runner_pool_tag) ||
      github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}', inputs.action_tag || 'ci', inputs.runner_pool_tag || 'private') || format('action:ci:pool:private') }}
on:
  pull_request_target:
    types: [labeled]
    branches: [master, unstable]
    paths:
      - 'servapps/**'
  push:
    branches: [unstable]
    paths:
      - 'servapps/**'
  workflow_dispatch:
    inputs:
      action_tag:
        description: Required workflow action tag
        type: choice
        options: [ci]
        required: true
      runner_pool_tag:
        description: Required private JIT runner pool tag
        type: choice
        options: [private]
        required: true
      pr_number:
        description: Trusted owner PR number
        type: string
        required: false
      pr_sha:
        description: Exact trusted owner PR head SHA
        type: string
        required: false
      pr_base_sha:
        description: Exact PR base SHA from the metadata event
        type: string
        required: false
      pr_base_branch:
        description: PR target branch from the metadata event
        type: string
        required: false
      target_run_id:
        description: Metadata-only pull_request_target run ID
        type: string
        required: false
      pr_author:
        description: PR author copied from the metadata-only event
        type: string
        required: false
      pr_repository:
        description: PR head repository copied from the metadata-only event
        type: string
        required: false
concurrency:
  group: validate-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master' &&
       inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' &&
       ((github.actor == 'snapetech' && inputs.pr_number == '' && inputs.pr_sha == '' && inputs.pr_base_sha == '' && inputs.pr_base_branch == '' && inputs.target_run_id == '' && inputs.pr_author == '' && inputs.pr_repository == '') ||
        (github.actor == 'github-actions[bot]' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.pr_base_branch != '' && inputs.target_run_id != '' && inputs.pr_author == 'snapetech' && inputs.pr_repository == github.repository))) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/unstable')
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-cosmos-servapps-official","ng-main-run-{0}","gha-{0}-validate"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Determine changed servapp directories
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ inputs.pr_sha }}
          PR_BASE_SHA: ${{ inputs.pr_base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_SHA" ]; then
            if [[ ! "$PR_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid PR revision inputs" >&2
              exit 1
            fi
            HEAD="$PR_SHA"
            BASE="$(git merge-base "$HEAD" "$PR_BASE_SHA")"
            if [ -z "$BASE" ]; then
              echo "Could not find the PR merge base" >&2
              exit 1
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            HEAD="$CURRENT_SHA"
            if [[ ! "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "changed=ALL" >> "$GITHUB_OUTPUT"
              echo "New branch push: full-repository validation requested."
              exit 0
            fi
            BASE="$PUSH_BEFORE_SHA"
          else
            echo "changed=ALL" >> "$GITHUB_OUTPUT"
            echo "Manual full-repository validation requested."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- servapps/ \
            | sed -E 's#^servapps/([^/]+)/.*#\1#' | sort -u)

          if [ -z "$CHANGED" ]; then
            echo "No servapp directories changed."
            echo "changed=" >> "$GITHUB_OUTPUT"
          else
            LIST=""
            for d in $CHANGED; do
              case " $LIST " in
                *" $d "*) ;;
                *) LIST="$LIST $d" ;;
              esac
            done
            echo "changed=${LIST## }" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changed servapps
        run: |
          CHANGED="${{ steps.changed.outputs.changed }}"
          if [ "$CHANGED" = "ALL" ]; then
            echo "== Validating entire repository =="
            node .github/scripts/validate-servapps.js \
              || { echo "::error::Servapp validation failed. See the report above."; exit 1; }
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "No servapp changes to validate."
            exit 0
          fi
          FAIL=0
          for d in $CHANGED; do
            if [ ! -d "servapps/$d" ]; then
              echo "::warning::servapps/$d was deleted in this PR; skipping."
              continue
            fi
            echo "== Validating servapps/$d =="
            if ! node .github/scripts/validate-servapps.js "$d"; then
              FAIL=1
              echo "::error file=servapps/$d::Validation failed for servapps/$d"
            fi
          done
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi

  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
      contains(github.event.pull_request.labels.*.name, 'action:ci') &&
      contains(github.event.pull_request.labels.*.name, 'pool:private') &&
      github.actor == 'snapetech' &&
      github.event.pull_request.user.login == 'snapetech' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.repository_id &&
      (github.event.pull_request.base.ref == 'master' || github.event.pull_request.base.ref == 'unstable')
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-packer","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch PR-head validation from master
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TARGET_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 - <<'ROUTE_VALIDATION_PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          sha = os.environ["PR_SHA"]
          base_sha = os.environ["PR_BASE_SHA"]
          base_branch = os.environ["PR_BASE_BRANCH"]
          pr_repository = os.environ["PR_REPOSITORY"]
          pr_author = os.environ["PR_AUTHOR"]
          target_run_id = os.environ["TARGET_RUN_ID"]
          labels = json.loads(os.environ["PR_LABELS_JSON"])
          action_labels = [label for label in labels if isinstance(label, str) and label.startswith("action:")]
          pool_labels = [label for label in labels if isinstance(label, str) and label.startswith("pool:")]
          if action_labels != ["action:ci"] or pool_labels != ["pool:private"]:
              raise SystemExit("add exactly action:ci and pool:private labels")
          if repository != "snapetech-org/cosmos-servapps-official":
              raise SystemExit("unexpected repository")
          if os.environ["GITHUB_REPOSITORY_ID"] != os.environ["PR_REPOSITORY_ID"]:
              raise SystemExit("pull request head repository ID does not match this repository")
          if pr_author != "snapetech" or pr_repository.lower() != repository.lower():
              raise SystemExit("private validation only accepts the repository owner's pull requests")
          if base_branch not in {"master", "unstable"}:
              raise SystemExit("unsupported pull request base branch")
          if not re.fullmatch(r"[1-9][0-9]*", number) or not re.fullmatch(r"[1-9][0-9]*", target_run_id):
              raise SystemExit("invalid pull request number or metadata run ID")
          if not re.fullmatch(r"[0-9a-f]{40}", sha) or not re.fullmatch(r"[0-9a-f]{40}", base_sha):
              raise SystemExit("invalid pull request revision")

          payload = json.dumps({
              "ref": "master",
              "inputs": {
                  "action_tag": "ci",
                  "runner_pool_tag": "private",
                  "pr_number": number,
                  "pr_sha": sha,
                  "pr_base_sha": base_sha,
                  "pr_base_branch": base_branch,
                  "target_run_id": target_run_id,
                  "pr_author": pr_author,
                  "pr_repository": pr_repository,
              },
          }).encode("utf-8")
          request = Request(
              "https://api.github.com/repos/snapetech-org/cosmos-servapps-official/actions/workflows/validate.yml/dispatches",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              if response.status != 204:
                  raise SystemExit(f"workflow dispatch returned HTTP {response.status}")
          ROUTE_VALIDATION_PY

  report-owner-pr-check:
    name: Report trusted owner PR validation
    needs: [validate]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' &&
      inputs.pr_author == 'snapetech' && inputs.pr_repository == github.repository &&
      inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' &&
      github.actor == 'github-actions[bot]'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-cosmos-servapps-official","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      contents: none
    steps:
      - name: Attach validation result to the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ inputs.pr_sha }}
          VALIDATION_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'failure' || 'success' }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'OWNER_PR_REPORTER_PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          sha = os.environ["PR_SHA"]
          result = os.environ["VALIDATION_RESULT"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid pull request head SHA")
          conclusion = "success" if result == "success" else ("cancelled" if result == "cancelled" else "failure")
          run_id = os.environ["VALIDATION_RUN_ID"]
          payload = json.dumps({
              "name": "Cosmos ServApps validation owner PR",
              "head_sha": sha,
              "external_id": run_id,
              "status": "completed",
              "conclusion": conclusion,
              "details_url": f"https://github.com/snapetech-org/cosmos-servapps-official/actions/runs/{run_id}",
              "output": {
                  "title": "Cosmos ServApps validation owner PR " + conclusion,
                  "summary": "See the linked master-pinned workflow run for validation details.",
              },
          }).encode("utf-8")
          request = Request(
              "https://api.github.com/repos/snapetech-org/cosmos-servapps-official/check-runs",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              if response.status not in {201, 202}:
                  raise SystemExit(f"check creation returned HTTP {response.status}")
          OWNER_PR_REPORTER_PY
